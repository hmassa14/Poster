name: Evals

# Runs the eval suite when anything that shapes the model's behaviour changes.
# Fails the check if a metric is below its threshold in policy.yaml.
# Needs ANTHROPIC_API_KEY, so it does not run on pull requests from forks.

on:
  pull_request:
    paths:
      - "prompts/**"
      - "publication/**"
      - "policy.yaml"
      - "poster.yaml"
      - "poster/**"
      - "templates/**"
      - "evals/cases/**"
  workflow_dispatch:
    inputs:
      flow:
        description: "Flow to run (all|critic|writer|triage|escalation|seo)"
        default: "all"
      reps:
        description: "Repetitions per case"
        default: "1"
      model:
        description: "Model under test (blank = poster.yaml)"
        required: false

permissions:
  contents: read
  pull-requests: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Harness oracle/null check (no API calls)
        run: poster eval --smoke

  evals:
    needs: smoke
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Run evals
        run: |
          ARGS="--enforce --flow ${{ inputs.flow || 'all' }} --reps ${{ inputs.reps || '1' }} --out evals/results/ci"
          [ -n "${{ inputs.model }}" ] && ARGS="$ARGS --model ${{ inputs.model }}"
          poster eval $ARGS | tee eval-report.md
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: |
            evals/results/ci/**
            eval-report.md
      - name: Comment report on the PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.existsSync('eval-report.md') ? fs.readFileSync('eval-report.md', 'utf8') : 'Eval run produced no report.';
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number,
              body: body + "\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_",
            });
