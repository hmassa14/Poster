name: Feedback

# Runs when someone opens or comments on an issue labeled `feedback`, and
# nightly as a sweep. Folds the feedback into publication/style.md,
# publication/format.md and memory/lessons.md so the next issue reflects it.

on:
  issues:
    types: [opened, labeled, edited]
  issue_comment:
    types: [created]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: feedback
  cancel-in-progress: false

jobs:
  feedback:
    if: github.event_name != 'issues' && github.event_name != 'issue_comment' || contains(github.event.issue.labels.*.name, 'feedback')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - run: poster feedback --close-issues
      - name: Commit
        run: |
          git config user.name "poster-bot"
          git config user.email "poster-bot@users.noreply.github.com"
          git add publication memory feedback
          git diff --cached --quiet || (git commit -m "Fold in reader feedback" && git push origin HEAD:${{ github.ref_name }})
