[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "poster"
version = "0.1.0"
description = "An AI-written, AI-maintained weekly AI newsletter and blog: research, writing, review, SEO, publishing, and a feedback loop."
requires-python = ">=3.11"
dependencies = [
  "anthropic>=1.5,<2",
  "pydantic>=2.7,<3",
  "jinja2>=3.1,<4",
  "markdown>=3.6,<4",
  "feedparser>=6.0,<7",
  "pyyaml>=6,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
poster = "poster.cli:main"

[tool.setuptools.packages.find]
include = ["poster*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
